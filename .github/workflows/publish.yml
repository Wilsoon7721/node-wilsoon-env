name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball, but publish nothing'
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 bundles npm 10, which predates OIDC trusted publishing (needs 11.5.1+).
      # The toolchain that publishes is not the toolchain the package has to support.
      - name: Use an npm that can trust-publish
        run: npm install -g npm@^11

      - run: npm ci --ignore-scripts

      - name: Lint
        run: npx eslint .

      - run: npm test

      - name: Show what would be published
        run: npm publish --dry-run --provenance --access public

      # No NODE_AUTH_TOKEN. Trusted publishing exchanges the id-token above for a
      # registry credential; an empty _authToken makes npm attempt token auth and
      # fail with 401 rather than falling back, so the variable is worse than absent.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
